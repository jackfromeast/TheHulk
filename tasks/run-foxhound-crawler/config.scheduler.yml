scheduler:
  TEST_NAME: "foxhound-crawler"
  # Path to workspace (base directory for storing results)
  WORKSPACE: "tasks/run-foxhound-crawler/output"

  # Option: "seed" or "list"
  MODE: "list"
  SEED_URL: "https://baidu.com/index.html"
  URL_LIST: "dataset/Trenco_KJX3W_Top5K_filtered.csv"
  URL_LIST_FROM: 0
  URL_LIST_TO: 1000

  # Format of the urls.csv file:
  #   1,google.com
  #   2,facebook.com
  #   3,amazonaws.com
  #   4,microsoft.com
  #   5,apple.com
  #   6,googleapis.com
  #   7,akamaiedge.net
  #   8,youtube.com
  #   9,a-msedge.net
  #   10,twitter.com  

  # Maximum number of workers to run in parallel
  MAX_WORKER: 1
  # Maximum number of urls to visit
  MAX_URL: 1
  # Time budget for each worker to visit a single domain
  TIMEOUT_PER_DOMAIN: 1800000


