### Description:
### --------------------------------
### This file holds the configuration to start the browser 
### and perform concolic execution analysis.


chrome:
  CHROME_EXECUTABLE_PATH: "/usr/bin/google-chrome"
  CHROME_FLAGS: [
    "--no-sandbox",
    '--disable-setuid-sandbox',
    '--disable-gpu'
  ]
  HEADLESS: true
  DEVTOOLS: false

foxhound:
  FOXHOUND_EXECUTABLE_PATH: "/home/jackfromeast/Desktop/TheHulk/third-party/jaw-v3-thething/crawler/foxhound/project-foxhound/obj-tf-release/dist/foxhound/foxhound"
  FOXHOUND_FLAGS: [
    "--no-sandbox",
    '--disable-setuid-sandbox',
    '--disable-gpu'
  ]
  HEADLESS: true
  DEVTOOLS: false

collector:
  # Collectors configuration
  COLLECT_ALT_URLS: true
  COLLECT_AND_CREATE_PAGE: true
  COLLECT_CONSOLE_LOGS: true
  COLLECT_REQUESTS: false
  COLLECT_WEB_STORAGE: false
  COLLECT_COOKIES: false
  COLLECT_HTML: false
  COLLECT_CSS: false
  COLLECT_SCRIPTS: false
  COLLECT_BROWSER_STDERR: false
  COLLECT_BROWSER_STDOUT: false
  COLLECT_XHR_REQUESTS: false
  COLLECT_FETCH_REQUESTS: false
  EXTRACT_DOM_LOOKUPS: false
  EXTRACT_UNDEF_LOOKUPS: false
  COLLECT_TAINTING_FLOWS: true

navigator:
  BROWSER: "foxhound"
  WAIT_BEFORE_NEXT_URL: 1000
  NAVIGATION_TIMEOUT: 0
  # For puppeteer, options:
  # ['load', 'domcontentloaded']
  # ['networkidle0']
  # For playwright:
  # load|domcontentloaded|networkidle|commit
  NAVIGATION_WAIT_UNTIL: 'domcontentloaded'

proxy:
  PROXY_SERVER: false
  PROXY_PORT: false

callbacks:
  BEFORE_LOAD_CBS:
    - file: "crawler/src/callbacks/bind-taint-handler-foxhound-callbacks.js"
      function_name: "setupFoxhoundTaintHandlerCb"
  
  PAGE_ACTIONS_CBS:
      - file: "crawler/src/callbacks/wait-five-sec-callbacks.js"
        function_name: "WaitForFiveSecCb"

  AFTER_LOAD_CBS: []

  POST_VISIT_CBS: []

  # Callbacks that will be invoked after done visiting all domains in the current task
  POST_PROCESS_CBS:
    PER_PAGE: []

    # Will be invoked after processing all domains, should directly process postProcesser.data
    AFTER_ALL_DOMAINS: []

others:
  FOXHOUND_TAINT_HANDLER_PATH: "crawler/src/scripts/flow-handler-foxhound.js"